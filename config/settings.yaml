screening:
  policy_version: screening-v1
  scope:
    territories:
    - UK
    activity: Furniture storage/distribution without manufacturing or processing
    one_occupied_site: true
    requires_property_damage: true
    synthetic_exception_case_id: NB-2026-001
  checks:
  - id: SC01
    name: Company and site identification
    question: Can the company and the proposed insured site be identified?
  - id: SC02
    name: Territory
    question: Is the site within the configured UK demonstration scope?
  - id: SC03
    name: Business activity
    question: Is the activity furniture storage/distribution without manufacturing,
      as required by this demonstration?
  - id: SC04
    name: Site and occupancy
    question: Does the submission describe one occupied site?
  - id: SC05
    name: Requested cover
    question: Is property damage insurance requested?
  - id: SC06
    name: Essential information quality
    question: Is the source readable, with sufficient and consistent information to
      assess SC01–SC05?
  selector_labels:
    SC01: SC01 Company and site
    SC02: SC02 Territory
    SC03: SC03 Business activity
    SC04: SC04 Site and occupancy
    SC05: SC05 Requested cover
    SC06: SC06 Information quality
  check_results:
  - Pass
  - Fail
  - Unknown
  workflow_outcomes:
  - Proceed to assessment
  - Pause for clarification
  - Outside demo scope
  scope_failure_checks:
  - SC02
  - SC03
  - SC04
  - SC05
  essential_failure_checks:
  - SC01
  - SC06
  approved_policy_hash: f8d1e3c9a4727309940d7808a9a08225fc721dc0cebb526c0acb328c66d2dc62
app:
  title: Explainable Property Underwriting
  case_catalogue_path: config/case_catalogue.json
  default_information_category: Company
  default_screening_check: SC01
  document_initially_visible: false
access:
  mode: local_owner
belief_assessment:
  increment: 0.05
  sum_tolerance: 1.0e-06
decision_model_path: config/decision_model.yaml

decision:
  routing_guidance:
    - Outside-demo-scope screening requires outside_demo_scope within this prototype.
    - Paused screening requires clarification or senior review before continuation.
    - Consider unresolved documented concerns and human reviews; do not route solely by the largest belief.
    - A senior referral can be primary with information requests as secondary actions. No acceptance or binding authority is provided.

# V2 isolation: this checkout never consumes V1 credential names.
services:
  mode: turso_readonly
  credential_env_path: C:/Weihua/project/explainable-property-underwriting-mvp/.env
  local_database_path: .runtime/v2.sqlite
  test_scope_confirmed: false
  allowed_test_database_hosts: []
reliability:
  identity_version: material-input-v2
  input_limits:
    default:
      max_pdf_characters: 160000
      max_request_utf8_bytes: 500000
      max_pages: 100
    models:
      gpt-5-mini:
        max_pdf_characters: 160000
        max_request_utf8_bytes: 500000
        max_pages: 100

# Temporary display-only experiment. Cloud remains read-only.
belief_comparison:
  calculation_input_method: direct_ai
  enabled: true
  local_owner_enabled: true
  input_version: full-reviewed-document-v2
  distribution_tolerance: 0.000001
  score_scale:
    minimum: 1
    maximum: 5
    anchors:
      - {score: 1, label: very low concern}
      - {score: 2, label: low concern}
      - {score: 3, label: moderate concern}
      - {score: 4, label: high concern}
      - {score: 5, label: very high concern}
